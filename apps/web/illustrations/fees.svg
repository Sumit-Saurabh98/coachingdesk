<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 690" width="340" height="690" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari',sans-serif">
  <defs><clipPath id="screen"><rect x="20" y="20" width="300" height="650" rx="36"/></clipPath></defs>
  <rect x="8" y="8" width="324" height="674" rx="46" fill="#111827"/>
  <g clip-path="url(#screen)">
    <rect x="20" y="20" width="300" height="650" fill="#ffffff"/>
    <rect x="20" y="20" width="300" height="96" fill="#1565c0"/>
