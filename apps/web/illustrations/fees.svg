    <text x="36" y="390" font-size="13" fill="#5a6470" font-weight="700">{{t:img.mostOverdue}}</text>
    <text x="36" y="420" font-size="14.5" fill="#111827" font-weight="600">{{t:img.s3}}</text><text x="36" y="440" font-size="12" fill="#5a6470">{{t:img.days14}}</text><text x="304" y="428" text-anchor="end" font-size="15" fill="#b42318" font-weight="800">₹3,000</text>
    <line x1="36" y1="456" x2="304" y2="456" stroke="#eef1f5"/>
    <text x="36" y="484" font-size="14.5" fill="#111827" font-weight="600">{{t:img.s4}}</text><text x="36" y="504" font-size="12" fill="#5a6470">{{t:img.days9}}</text><text x="304" y="492" text-anchor="end" font-size="15" fill="#b42318" font-weight="800">₹1,500</text>

    <rect x="20" y="604" width="300" height="66" fill="#f3f6fb"/><circle cx="57" cy="625" r="6" fill="#6b7280"/><text x="57" y="654" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="600">{{t:img.tabToday}}</text><circle cx="132" cy="625" r="6" fill="#6b7280"/><text x="132" y="654" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="600">{{t:img.tabStudents}}</text><rect x="185" y="614" width="44" height="22" rx="11" fill="#d6e4ff"/><circle cx="207" cy="625" r="6" fill="#1565c0"/><text x="207" y="654" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="600">{{t:img.tabFees}}</text><circle cx="282" cy="625" r="6" fill="#6b7280"/><text x="282" y="654" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="600">{{t:img.tabMore}}</text>
