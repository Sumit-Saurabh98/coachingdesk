# Local development only: Postgres + Redis. Production uses RDS + ElastiCache (docs/TECH_STACK.md).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: coachingdesk
      POSTGRES_PASSWORD: coachingdesk
      POSTGRES_DB: coachingdesk
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coachingdesk -d coachingdesk']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # noeviction + AOF: BullMQ must never lose jobs (docs/LLD.md §7).
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
